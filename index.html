<!DOCTYPE html>

<head>
<meta charset="utf-8">

<style>
:root{--ink:#0E0E0D;--paper:#FBFAF8;--muted:#A6A6A2;--line:#2A2A28}
*{box-sizing:border-box;margin:0;padding:0}
html{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body{min-height:100vh;background:var(--ink);color:var(--paper);font-family:Jost,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:48px 24px;text-align:center}
.logo{width:min(560px,82vw);height:auto}
.tag{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.tag span{font-size:11px;letter-spacing:.42em;color:var(--muted)}
.tag i{display:block;width:54px;height:1px;background:var(--line)}
.line{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:clamp(22px,3.6vw,30px);line-height:1.55;color:#D8D6D1;max-width:22ch}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.links a{font-size:11px;letter-spacing:.2em;color:var(--paper);text-decoration:none;border:1px solid #3A3A38;padding:15px 26px;transition:background .2s,color .2s}
.links a:hover,.links a:focus-visible{background:var(--paper);color:var(--ink)}
.foot{font-size:10px;letter-spacing:.28em;color:#6E6E6B}
@media(prefers-reduced-motion:no-preference){body>*{animation:in .7s ease-out both}body>*:nth-child(2){animation-delay:.1s}body>*:nth-child(3){animation-delay:.2s}body>*:nth-child(4){animation-delay:.3s}body>*:nth-child(5){animation-delay:.4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<img class="logo" src="assets/logo.png" alt="I'm SQ Shah">
<div class="tag"><i></i><span>PERFORMANCE MARKETING</span><i></i></div>
<p class="line">Ad spend that ends in sales, not impressions.</p>

</nav>
<p class="foot">FULL PORTFOLIO COMING SOON</p>
</body>
