<style>
.lnks{display:grid;border-top:1px solid var(--hair);margin-top:clamp(30px,5vh,52px)}
.lnk{position:relative;display:grid;grid-template-columns:minmax(90px,.4fr) 1fr auto;
  gap:18px;align-items:center;padding:clamp(20px,2.8vh,30px) 0;
  border-bottom:1px solid var(--hair);overflow:hidden}
.lnk::before{content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(90deg,rgba(251,250,248,.07),transparent);
  transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.3,0,.1,1)}
.lnk>*{position:relative;z-index:1}
.lk{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.lv{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:-.02em;
  font-size:clamp(16px,1.9vw,26px);color:#D6D4CE;transition:color .4s}
.la{font-size:17px;color:var(--dim);transition:transform .5s cubic-bezier(.3,0,.1,1),color .4s}
@media (hover:hover){
  .lnk:hover::before{transform:scaleX(1)}
  .lnk:hover .lv{color:#fff}
  .lnk:hover .la{transform:translateX(9px);color:var(--paper)}
}
</style>
